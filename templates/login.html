<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Login{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <!-- site login form container-->
    <div class="login-container">
        <h2 class="login-title">Login</h2>
        <p class="login-description">Welcome back! Please login to your account.</p>
        <form class="login-form" method="POST" action="{{ url_for('auth.login') }}">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p class="login-register-link">Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
        </p>
    </div>
    {% if error %}
    <p class="error-message">{{ error }}</p>
    {% endif %}
    {% block content %}
    {% endblock %}
</body>

</html>
<style>
    .login-container {
        max-width: 400px;
        margin: 100px auto;
        padding: 20px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .login-title {
        text-align: center;
        color: #333;
    }

    .login-description {
        text-align: center;
        color: #666;
        margin-bottom: 20px;
    }

    .login-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .login-form input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    .login-form button {
        padding: 10px;
        background-color: #0cdf75;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .login-form button:hover {
        background-color: #09b36c;
    }

    .login-register-link {
        text-align: center;
        color: #666;
        margin-top: 15px;
    }
</style>
