<!-- 
 register.html
 
-->


<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Register{% endblock %}</title>
        <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/x-icon">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>
</html>

<body>
    <!-- site registration form container-->
     <div class="register-container">
        <h2 class="register-title">Register</h2>
        <p class="register-description">Create your account</p>
        <form class="register-form" method="POST" action="{{ url_for('auth.register') }}">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        <p class="register-login-link">Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
     </div>
     {% if error %}
        <p class="error-message">{{ error }}</p>
     {% endif %}

     {% block content %}
     {% endblock %}
</body>
<style>
    .register-container {
        max-width: 400px;
        margin: 100px auto;
        padding: 20px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        
    }

    .register-title {
        text-align: center;
        color: #333;
    }

    .register-description {
        text-align: center;
        color: #666;
        margin-bottom: 20px;
    }

    .register-form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .register-form input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    .register-form button {
        padding: 10px;
        background-color: #0cdf75;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .register-form button:hover {
        background-color: #09b36c;
        transition: background-color 0.3s ease;
    }

    .register-login-link {
        text-align: center;
        margin-top: 15px;
    }

    .register-login-link a {
        color: #0cdf75;
        text-decoration: none;
        transition: color 0.3s ease;
    }

    .register-login-link a:hover {
        text-decoration: underline;
    }
</style>
