{% extends "base.html" %}

{% block title %}Edit Order - Good Days Coffee{% endblock %}

{% block content %}
<section class="edit-order-section">
    <h2>Edit Order #{{ order.id }}</h2>
    <p><strong>Item:</strong> {{ order.menu_item.name }}</p>
    <p><strong>Status:</strong> {{ order.status }}</p>

    <form method="POST" action="{{ url_for('orders.edit_order', order_id=order.id) }}">
        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" name="quantity" min="1" value="{{ order.quantity }}" required>
        <button type="submit">Update Order</button>
    </form>
</section>

<style>
    .edit-order-section {
        max-width: 500px;
        margin: 40px auto;
        padding: 20px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .edit-order-section form {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
</style>
{% endblock %}
